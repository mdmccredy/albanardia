<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBX · Silverbrooks Thompson International Airport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f1ea;--ink:#1d1f22;--muted:#5b5e63;--line:#dcd6c8;--panel:#fffdf8;--chip:#efeadf;--accent:#c2410c;--btn:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1d20;--ink:#ecebe6;--muted:#a9a8a2;--line:#393c41;--panel:#232529;--chip:#2c2f34;--accent:#fb923c;--btn:#2c2f34}}
:root[data-theme="dark"]{--bg:#1b1d20;--ink:#ecebe6;--muted:#a9a8a2;--line:#393c41;--panel:#232529;--chip:#2c2f34;--accent:#fb923c;--btn:#2c2f34}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Helvetica,sans-serif;overflow:hidden}
.app{display:flex;height:100%}
#wrap{position:relative;flex:1;min-width:0;overflow:hidden;background:#8db6d8;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
aside{width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.hd h1{font-family:"Barlow Condensed",sans-serif;font-size:24px;line-height:26px;margin:0;letter-spacing:.3px}
.hd .sub{color:var(--muted);font-size:14px;margin-top:4px}
.search{margin-top:12px;display:flex;gap:8px}
.search input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:15px;background:var(--btn);color:var(--ink)}
.search button,.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.layers label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);border-radius:999px;padding:6px 10px;cursor:pointer}
.body{flex:1;overflow:auto;padding:16px 20px}
.body h2{font-family:"Barlow Condensed",sans-serif;font-size:28px;margin:0 0 2px;line-height:30px}
.kind{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.body dl{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;margin:14px 0;font-size:14px}
.body dt{color:var(--muted)}
.body dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chips button{border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:6px;padding:6px 9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.chips button:hover,.btn:hover,.search button:hover{border-color:var(--accent)}
.sec{font-weight:700;font-size:13px;margin-top:12px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.legend{border-top:1px solid var(--line);padding:12px 20px;font-size:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:10px;border-radius:2px;display:inline-block;flex:none}
.ctl{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:44px;height:44px;border-radius:8px;border:1px solid #9aa3ad;background:#fff;color:#1d1f22;font-size:22px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.scale{position:absolute;left:70px;bottom:18px;background:rgba(255,255,255,.9);border-radius:6px;padding:4px 8px;font-size:12px;color:#1d1f22;font-weight:600}
.scale i{display:block;height:6px;border:2px solid #1d1f22;border-top:none;margin-top:3px}
.north{position:absolute;right:14px;top:14px;width:52px;height:52px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.zoomhint{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.9);color:#1d1f22;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600}
.toggle{display:none}
/* map styles */
#map text{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.mk{transform:translate(var(--x),var(--y)) scale(var(--ik))}
.t1,.t2{display:none}
#map.z1 .t1,#map.z2 .t1,#map.z2 .t2{display:inline}
#map.z2 .hide2{display:none}
#map.noac .ac{display:none}
#map.nohs .hs{display:none}
#map.noals .als{display:none}
#map.nolab .lab{display:none}
.hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.hitf{fill:transparent;cursor:pointer}
.bld{cursor:pointer}
.bld:hover{filter:brightness(1.08)}
.rl{font-size:calc(12px * var(--ik));font-weight:600;fill:#3f3d38;paint-order:stroke;stroke:#f4f1ea;stroke-width:calc(3px * var(--ik));letter-spacing:calc(.6px * var(--ik))}
.rl.fw{font-size:calc(13px * var(--ik));font-weight:700;fill:#1f3f7a}
@media (max-width:760px){
 .app{flex-direction:column}
 aside{width:100%;height:46%;border-left:none;border-top:1px solid var(--line)}
 aside.closed{height:auto}
 aside.closed .body,aside.closed .legend,aside.closed .layers,aside.closed .search{display:none}
 .toggle{display:inline-flex;align-items:center}
 .hd{display:flex;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
 <div id="wrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Airport diagram of SBX, pan and zoom">
   <g id="vp"></g>
  </svg>
  <div class="north" aria-hidden="true"><svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 2 L24 26 L15 20 L6 26 Z" fill="#1d1f22"/><text x="15" y="36" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="12" fill="#1d1f22">N</text></svg></div>
  <div class="ctl">
   <button id="zin" aria-label="Zoom in">+</button>
   <button id="zout" aria-label="Zoom out">−</button>
   <button id="zfit" aria-label="Fit airport" style="font-size:14px">Fit</button>
  </div>
  <div class="scale" id="scale"><span id="scalet">1,000 ft</span><i id="scaleb"></i></div>
  <div class="zoomhint" id="zh">Zoom in for detail</div>
 </div>
 <aside id="panel">
  <div class="hd">
   <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div><h1>Silverbrooks Thompson International</h1><div class="sub">SBX / KSBX · Silverbrooks, Albanardia · <a href="../" style="color:inherit">Albanardia home</a></div></div>
    <button class="btn toggle" id="ptoggle">Info</button>
   </div>
   <form class="search" id="sform"><input id="q" placeholder="Search gate, runway, taxiway, road…" aria-label="Search"><button type="submit">Go</button></form>
   <div class="layers">
    <label><input type="checkbox" id="lac" checked> Aircraft</label>
    <label><input type="checkbox" id="lhs" checked> Hot spots</label>
    <label><input type="checkbox" id="lals" checked> Approach lights</label>
    <label><input type="checkbox" id="llab" checked> Labels</label>
   </div>
  </div>
  <div class="body" id="info"></div>
  <div class="legend">
   <span><i class="sw" style="background:#34363a"></i>Runway</span>
   <span><i class="sw" style="background:#c9c3b6;border-bottom:2px solid #e0a91b"></i>Taxiway</span>
   <span><i class="sw" style="background:#d8d3c7"></i>Apron</span>
   <span><i class="sw" style="background:#b9b2a3"></i>Terminal</span>
   <span><i class="sw" style="background:#c0bbb0"></i>Road</span>
   <span><i class="sw" style="background:#e3ddd0;border:1px solid #9c968a"></i>Parking</span>
   <span><i class="sw" style="border:2px dashed #c026d3;height:12px"></i>Hot spot</span>
   <span><i class="sw" style="background:#1b8a8f"></i>AirLink</span>
   <span><i class="sw" style="background:#e1e6cf;border:1px solid #b9c0a4"></i>Airfield grass</span>
   <span><i class="sw" style="background:repeating-linear-gradient(90deg,#1d1f22 0 3px,transparent 3px 5px)"></i>Hold line</span>
  </div>
 </aside>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg', FT=8;
const svg=document.getElementById('map'), vp=document.getElementById('vp');
function E(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const f=n=>Math.round(n*100)/100;
const P=p=>p.map(q=>f(q[0])+','+f(q[1])).join(' ');
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],len=a=>Math.hypot(a[0],a[1]);
const unit=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l]},lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],dot=(a,b)=>a[0]*b[0]+a[1]*b[1],rn=d=>[-d[1],d[0]],neg=a=>[-a[0],-a[1]];
const bearing=v=>(Math.atan2(v[0],-v[1])*180/Math.PI+360)%360;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function lineD(p){return 'M'+p.map(q=>f(q[0])+' '+f(q[1])).join(' L');}
function roundD(p,r=22){if(p.length<3)return lineD(p);let s=`M${f(p[0][0])} ${f(p[0][1])}`;for(let i=1;i<p.length-1;i++){const a=p[i-1],b=p[i],c=p[i+1];const rr=Math.min(r,len(sub(b,a))/2,len(sub(c,b))/2);const p1=add(b,unit(sub(a,b)),rr),p2=add(b,unit(sub(c,b)),rr);s+=` L${f(p1[0])} ${f(p1[1])} Q${f(b[0])} ${f(b[1])} ${f(p2[0])} ${f(p2[1])}`;}const e=p[p.length-1];return s+` L${f(e[0])} ${f(e[1])}`;}
function offsetPl(p,d){return p.map((pt,i)=>{let n;if(i==0)n=rn(unit(sub(p[1],p[0])));else if(i==p.length-1)n=rn(unit(sub(p[i],p[i-1])));else{const n1=rn(unit(sub(p[i],p[i-1]))),n2=rn(unit(sub(p[i+1],p[i])));const m=unit(add(n1,n2));const c=dot(m,n1);n=[m[0]/c,m[1]/c];}return add(pt,n,d);});}
function segX(a,b,c,d,tol=.02){const r=sub(b,a),s=sub(d,c),den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;const q=sub(c,a);const t=(q[0]*s[1]-q[1]*s[0])/den,u=(q[0]*r[1]-q[1]*r[0])/den;if(t<-tol||t>1+tol||u<-tol||u>1+tol)return null;return{t,u,p:add(a,r,t)};}
function nearestOnSeg(p,a,b){const ab=sub(b,a);let t=dot(sub(p,a),ab)/dot(ab,ab);t=Math.max(0,Math.min(1,t));return add(a,ab,t);}
function lineHit(p1,p2,q1,q2){const r=sub(p2,p1),s=sub(q2,q1),den=r[0]*s[1]-r[1]*s[0];const q=sub(q1,p1);const t=(q[0]*s[1]-q[1]*s[0])/den;return add(p1,r,t);}
function plLen(p){let L=0;for(let i=1;i<p.length;i++)L+=len(sub(p[i],p[i-1]));return L;}
function plAt(p,fr){let T=plLen(p)*fr;for(let i=1;i<p.length;i++){const l=len(sub(p[i],p[i-1]));if(T<=l)return{p:lerp(p[i-1],p[i],T/l),d:unit(sub(p[i],p[i-1]))};T-=l;}return{p:p[p.length-1],d:unit(sub(p[p.length-1],p[p.length-2]))};}

/* ---------- layers ---------- */
const L={};
['water','land','apron','mask','fapron','landside','roads','rfill','roadmk','brg','als','twypave','rwy','rwymk','twymk','stand','bld','bridge','ac','hs','hit','sel','lab'].forEach(n=>L[n]=E('g',{id:'L-'+n},vp));
L.hs.setAttribute('class','hs');L.als.setAttribute('class','als');L.ac.setAttribute('class','ac t2');L.lab.setAttribute('class','lab');
const LAND='#efeadf',APRON='#d8d3c7',PAVE='#c9c3b6',TWY='#e0a91b',RWYC='#34363a',ROAD='#c0bbb0';
E('rect',{x:-3000,y:-3000,width:8300,height:7600,fill:'#8db6d8'},L.water);
{const defs=E('defs',{},svg);const pt=E('pattern',{id:'stall',width:1.125,height:7.5,patternUnits:'userSpaceOnUse'},defs);E('path',{d:'M0 0 V2.25 M0 5.25 V7.5 M0 3.75 H1.125',stroke:'#a39c8d','stroke-width':.14},pt);}
const land=[[0,0],[1440,0],[1500,40],[1580,110],[1660,175],[1750,212],[1830,190],[1890,140],[1950,70],[2010,30],[2090,38],[2160,65],[2185,120],[2182,300],[2180,470],[2170,540],[2060,600],[2080,640],[2230,715],[2245,760],[2195,830],[2150,855],[2135,1000],[2100,1150],[2000,1290],[1900,1400],[1780,1460],[1560,1560],[1300,1600],[1250,1592],[1000,1480],[760,1500],[560,1500],[430,1472],[300,1380],[270,1250],[300,1050],[330,900],[300,720],[220,610],[120,500],[0,420]];
// land continues off-map to the north and west
E('polygon',{points:P([[-3000,-3000],[1440,-3000],...land.slice(1),[-3000,420]]),fill:'#e1e6cf',stroke:'#7596b3','stroke-width':1.5},L.land);

/* ---------- labels (constant screen size) ---------- */
const INDEX=[];
function mk(pt,cls,parent){return E('g',{class:'mk '+(cls||''),style:`--x:${f(pt[0])}px;--y:${f(pt[1])}px`},parent||L.lab);}
function txt(g,s,o){const t=E('text',Object.assign({x:0,y:0,'text-anchor':'middle','dominant-baseline':'central'},o||{}),g);t.textContent=s;return t;}
function halo(g,s,size,fill,w,extra){return txt(g,s,Object.assign({'font-size':size,'font-weight':w||700,fill,'paint-order':'stroke',stroke:'#f4f1ea','stroke-width':3,'stroke-linejoin':'round'},extra||{}));}
function tag(el,kind,id){el.setAttribute('data-kind',kind);el.setAttribute('data-id',id);return el;}

/* ---------- runways ---------- */
const RWY=[
 {id:'12/30',e:[{d:'12',p:[1080,45],als:'ALSF-2',aL:300},{d:'30',p:[2195,755],als:'MALSR',aL:175}]},
 {id:'8/26',e:[{d:'8',p:[440,1448],als:'MALSR',aL:175},{d:'26',p:[1790,1226],als:'MALSR',aL:175}]},
 {id:'3L/21R',e:[{d:'3L',p:[1275,1560],als:'ALSF-2',aL:300},{d:'21R',p:[2025,125],als:'ALSF-2',aL:300}]},
 {id:'3R/21L',e:[{d:'3R',p:[1612,1124],als:'REIL only',aL:0},{d:'21L',p:[2120,165],als:'MALSR',aL:175}]}];
RWY.forEach(r=>{r.a=r.e[0].p;r.b=r.e[1].p;r.dir=unit(sub(r.b,r.a));r.L=len(sub(r.b,r.a));r.hw=9.375;r.cross=new Set();r.x=new Set();});
const [R12,R8,R3L,R3R]=RWY;
const rp=(r,t)=>lerp(r.a,r.b,t);
const n12=rn(R12.dir),n8=neg(rn(R8.dir)),w3=neg(rn(R3L.dir)),e3=rn(R3R.dir);
const off=(r,t,d,s)=>add(rp(r,t),s,d);

/* ---------- taxiways ---------- */
const TW={};
function tw(id,pts,type,note){TW[id]={id,pts,type,note:note||'',conn:new Set(),rw:new Set()};}
const D30=Math.tan(Math.PI/6);
tw('L',[off(R12,0,70,n12),off(R12,1,70,n12)],'Parallel taxiway','Full-length parallel on the terminal side of Runway 12/30.');
tw('M',[off(R12,.06,-70,n12),off(R12,.95,-70,n12)],'Parallel taxiway','North-side parallel of Runway 12/30; serves the GA/FBO ramp.');
tw('P',[off(R8,0,70,n8),off(R8,1,70,n8)],'Parallel taxiway','Full-length parallel on the terminal side of Runway 8/26.');
tw('E',[off(R3L,.02,70,w3),off(R3L,.95,70,w3)],'Parallel taxiway','West parallel of Runway 3L/21R; main route from the terminal to the 3/21 complex.');
tw('F',[off(R3L,.275,-50,w3),off(R3L,.95,-50,w3)],'Parallel taxiway','Center taxiway between Runways 3L/21R and 3R/21L.');
tw('R',[off(R3R,.02,70,e3),off(R3R,.95,70,e3)],'Parallel taxiway','East parallel of Runway 3R/21L; serves the Cargo Complex.');
tw('N',[[620,340],[660,240],[850,190],[1000,125],TW.L.pts[0]],'Taxiway','Wraps the north side of Concourse D to the Runway 12 end.');
const Py=x=>{const a=TW.P.pts[0],b=TW.P.pts[1];return a[1]+(x-a[0])*(b[1]-a[1])/(b[0]-a[0]);};
tw('W',[[436,Py(436)],[437,1100],[440,830],[470,745],[540,705],[600,692]],'Taxiway','West taxiway around Concourse X and the new X West pier.');
tw('K',[[1140,362],[1170,330],nearestOnSeg([1170,330],...TW.L.pts)],'Connector','Links the D/C ramp to Taxiway L.');
const ELj=lineHit(...TW.E.pts,...TW.L.pts);
tw('G',[[1392,592],[1432,562],ELj],'Connector','Links the C ramp to the E/L junction.');
tw('H',[[1468,735],[1500,704],lineHit([1490,702],[2100,708],...TW.R.pts)],'Crossfield taxiway','Crosses Runways 3L/21R and 3R/21L between the C/B ramp and Taxiway R.');
tw('J',[[1438,992],[1470,962],lineHit([1455,960],[2100,960],...TW.R.pts)],'Crossfield taxiway','Crosses Runways 3L/21R and 3R/21L between the B ramp and Taxiway R.');
tw('L1',[off(R12,.02,70,n12),rp(R12,.02)],'Runway entrance','Entrance to Runway 12.');
tw('L2',[off(R12,.3,70,n12),off(R12,.3,-70,n12)],'Crossover','Crosses Runway 12/30 between L and M.');
tw('L3',[off(R12,.6,70,n12),off(R12,.6,-70,n12)],'Crossover','Crosses Runway 12/30 between L and M.');
tw('L4',[off(R12,.98,70,n12),rp(R12,.98)],'Runway entrance','Entrance to Runway 30.');
tw('L5',[rp(R12,.35),off(R12,.35+70/D30/R12.L,70,n12)],'Rapid exit (high-speed)','30° high-speed exit for arrivals on Runway 12.');
tw('L6',[rp(R12,.88),off(R12,.88-70/D30/R12.L,70,n12)],'Rapid exit (high-speed)','30° high-speed exit for arrivals on Runway 30.');
tw('M1',[[1650,268],nearestOnSeg([1650,268],...TW.M.pts)],'Connector','GA/FBO ramp to Taxiway M.');
tw('P1',[rp(R8,.02),off(R8,.02,70,n8)],'Runway entrance','Entrance to Runway 8.');
tw('P2',[[840,1222],[822,1262],[810,Py(810)]],'Connector','Concourse X ramp to Taxiway P.');
tw('P3',[[935,1200],[912,1246],[905,Py(905)]],'Connector','Concourse A ramp to Taxiway P.');
tw('P4',[[1165,1178],[1195,1214],[1205,Py(1205)]],'Connector','A/B ramp to Taxiway P.');
tw('P5',[[1335,1108],[1350,1150],[1352,Py(1352)]],'Connector','Concourse B ramp to Taxiway P.');
tw('P6',[rp(R8,.98),off(R8,.98,70,n8)],'Runway entrance','Entrance to Runway 26.');
tw('P7',[rp(R8,.62),off(R8,.62-70/D30/R8.L,70,n8)],'Rapid exit (high-speed)','30° high-speed exit for arrivals on Runway 26.');
tw('E1',[rp(R3L,.02),off(R3L,.02,70,w3)],'Runway entrance','Entrance to Runway 3L.');
tw('E2',[off(R3L,.275,70,w3),off(R3L,.275,-50,w3)],'Crossover','Crosses Runway 3L/21R between E and F.');
tw('E3',[off(R3L,.95,70,w3),off(R3L,.95,-50,w3)],'Crossover','Crosses Runway 3L/21R at the 21R end.');
tw('E4',[rp(R3L,.5),off(R3L,.5+70/D30/R3L.L,70,w3)],'Rapid exit (high-speed)','30° high-speed exit for arrivals on Runway 3L.');
tw('F1',[off(R3L,.275,-50,w3),rp(R3R,0)],'Runway entrance','Entrance to Runway 3R.');
tw('R1',[rp(R3R,.02),off(R3R,.02,70,e3)],'Runway entrance','Entrance to Runway 3R from the cargo side.');
tw('R2',[rp(R3R,.95),off(R3R,.95,70,e3)],'Runway entrance','Entrance to Runway 21L.');

// ---- dual parallels and extra exits / entrances
tw('Q',[off(R12,.03,115,n12),off(R12,.6,115,n12)],'Parallel taxiway','Outer (second) parallel of Runway 12/30 on the terminal side, so arrivals and departures flow in opposite directions on L and Q.');

 if(kind=='rwy'){const r=RWY.find(x=>x.id==id);E('line',{x1:r.a[0],y1:r.a[1],x2:r.b[0],y2:r.b[1],stroke:HL,'stroke-width':30,opacity:.35},L.sel);
  const lf=r.L*FT;h=`<div class="kind">Runway</div><h2>Runway ${r.id}</h2>${dl([['Length',fmt(lf)+' ft ('+fmt(lf*.3048)+' m)'],['Width','150 ft (46 m)'],['True bearing',r.e.map((e,i)=>e.d+': '+String(Math.round(bearing(i?neg(r.dir):r.dir))).padStart(3,'0')+'°').join(' · ')],['Markings','Precision instrument: threshold (12 bars), designators, aiming point, touchdown zone, centerline, edge stripes, blast-pad chevrons'],['Approach lights',r.e.map(e=>e.d+': '+e.als+(e.aL?' ('+fmt(e.aL*FT)+' ft)':'')).join('<br>')],['Intersects',[...r.x].map(x=>'Runway '+x).join(', ')||'None']])}<div class="sec">Crossing / entrance taxiways</div>${chips([...r.cross],'twy')}<div class="sec">Go to end</div><div class="chips">${r.e.map((e,i)=>`<button data-fly="${e.p[0]},${e.p[1]},4">Runway ${e.d} threshold</button>`).join('')}</div>`;
  if(fly)flyTo(lerp(r.a,r.b,.5),fitK()*1.3);}
 else if(kind=='twy'){const t=TW[id];hlPath(t.d,16);h=`<div class="kind">${t.type}</div><h2>Taxiway ${id}</h2>${dl([['Width','75 ft'],['Length',fmt(plLen(t.pts)*FT)+' ft'],['Crosses / enters',[...t.rw].map(x=>'Rwy '+x).join(', ')||'No runways']])}<p class="note">${t.note}</p><div class="sec">Connects to</div>${chips([...t.conn],'twy')}${t.rw.size?`<div class="sec">Runways</div>${chips([...t.rw],'rwy')}`:''}`;if(fly)flyTo(plAt(t.pts,.5).p,Math.max(k,fitK()*2.6));}
 else if(kind=='conc'){const C=CC[id],I=CCI[id];C.lines.forEach(l=>hlPath(roundD(l,14),C.w+10));const als=[...new Set(C.gates.map(g=>GATES[g].al))];h=`<div class="kind">Concourse</div><h2>Concourse ${id}</h2>${dl([['Gates',C.gates.length],['Airlines',alRanges(id)],['Lounges',I.lounge],['Security',I.sec],['Design aircraft',C.wide?'Widebody (ADG V: 777 / 787 / A350)':'Narrowbody (ADG III: 737 / A320 family)']])}<div class="sec">Airlines</div><div class="chips">${als.map(a=>`<button data-go="al:${a}">${AL[a][0]}</button>`).join('')}</div><div class="sec">Gates</div>${chips(C.gates,'gate')}`;if(fly)flyTo(C.hub,Math.max(k,fitK()*3));}
 else if(kind=='gate'){const g=GATES[id],C=CC[g.c];const i=C.gates.indexOf(id);E('circle',{cx:f(g.e[0]+g.u[0]*20),cy:f(g.e[1]+g.u[1]*20),r:16,fill:'none',stroke:HL,'stroke-width':3},L.sel);
  h=`<div class="kind">Gate · Concourse ${g.c}</div><h2>Gate ${id}</h2>${dl([['Airline',AL[g.al][0]],['Typical aircraft',AL[g.al][2]],['Stand','Contact stand, nose-in, 1 boarding bridge, 400 Hz power + PC air'],['Aircraft class',g.wide?'Widebody (ADG V)':g.al=='DLC'?'Regional jet (ADG III)':'Narrowbody (ADG III)'],['Split stand',/[ABC]$/.test(id)?'Yes (MARS sub-stand)':'No'],['Fueling','Hydrant pit'],['Pushback','Onto apron taxilane, tug required']])}<div class="sec">Neighbors</div>${chips([C.gates[i-1],C.gates[i+1]].filter(Boolean),'gate')}<div class="chips"><button data-go="al:${g.al}">All ${AL[g.al][0]} gates</button><button data-go="conc:${g.c}">Concourse ${g.c}</button></div>`;if(fly)flyTo(add(g.e,g.u,18),Math.max(k,fitK()*6));}
 else if(kind=='al'){const gs=ALG[id];gs.forEach(x=>{const g=GATES[x];E('circle',{cx:f(g.e[0]+g.u[0]*20),cy:f(g.e[1]+g.u[1]*20),r:18,fill:AL[id][1],opacity:.35,stroke:AL[id][1],'stroke-width':3},L.sel);});const cs=[...new Set(gs.map(x=>GATES[x].c))];h=`<div class="kind">Airline</div><h2>${AL[id][0]}</h2>${dl([['Gates',gs.length],['Concourses',cs.join(', ')],['Fleet here',AL[id][2]]])}<div class="sec">Gates</div>${chips(gs,'gate')}`;if(fly){const c=gs.reduce((a,x)=>add(a,GATES[x].e,1/gs.length),[0,0]);flyTo(c,Math.max(k,fitK()*2.2));}}
 else if(kind=='road'){const r=RD[id];hlPath(roundD(r.pts,24),14);h=`<div class="kind">${r.type}</div><h2>${r.name}</h2><p class="note">${r.desc}</p>`;if(fly)flyTo(plAt(r.pts,.5).p,Math.max(k,fitK()*2));}
 else if(kind=='fac'){const F=FAC[id];E('polygon',{points:P(F.poly),fill:'none',stroke:HL,'stroke-width':4},L.sel);h=`<div class="kind">${F.type}</div><h2>${F.name}</h2><p class="note">${F.desc}</p>`;if(fly)flyTo(F.c,Math.max(k,fitK()*3));}
 else if(kind=='term'){hlPath(roundD(offsetPl(TB,14),30),34);h=`<div class="kind">Terminal</div><h2>Main Terminal</h2>${dl([['Levels','Departures (upper), Arrivals (lower)'],['Frontage','Terminal Dr'],['Concourses','X, A, B, C, D (all airside-connected)']])}${chips(['X','A','B','C','D'],'conc')}`;}
 else if(kind=='poi'){const P_=POI[id];E('circle',{cx:f(P_.pt[0]),cy:f(P_.pt[1]),r:8,fill:'none',stroke:HL,'stroke-width':2.5},L.sel);h=`<div class="kind">${({food:'Restaurant',coffee:'Coffee',shop:'Shop',lounge:'Lounge',rest:'Restrooms',info:'Information',fam:'Family',tsa:'Security checkpoint',svc:'Service'})[P_.type]}</div><h2>${P_.name}</h2>${dl([['Location',P_.where],['Side',P_.where=='Main Terminal'&&!/USO/.test(P_.name)?'Pre-security (landside)':'Post-security (airside)']])}`;if(fly)flyTo(P_.pt,Math.max(k,fitK()*9));}
 else if(kind=='hs'){const hh=HOT.find(x=>x.id==id);E('circle',{cx:hh.p[0],cy:hh.p[1],r:38,fill:'none',stroke:HL,'stroke-width':4},L.sel);h=`<div class="kind">Hot spot</div><h2>${id}</h2><p class="note">${hh.why}</p>`;if(fly)flyTo(hh.p,Math.max(k,fitK()*3));}
 info.innerHTML='<div class="chips"><button data-home="1">← Overview</button></div>'+h;info.scrollTop=0;
 if(window.innerWidth<=760)document.getElementById('panel').classList.remove('closed');}
info.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.home){home();return;}if(b.dataset.go){const[kd,id]=b.dataset.go.split(/:(.+)/);show(kd,id,true);}if(b.dataset.fly){const[x,y,z]=b.dataset.fly.split(',').map(Number);flyTo([x,y],fitK()*z);}});

/* ---------- view / zoom ---------- */
let k=1,tx=0,ty=0;const W=2300,H=1920,Y0=-320;
const wrap=document.getElementById('wrap');
function fitK(){const r=wrap.getBoundingClientRect();return Math.min(r.width/W,r.height/H)*.96;}
function apply(){vp.setAttribute('transform',`translate(${f(tx)} ${f(ty)}) scale(${k})`);svg.style.setProperty('--ik',1/k);const fk=fitK();const z=k/fk;svg.classList.toggle('z1',z>=2&&z<4.6);svg.classList.toggle('z2',z>=4.6);
 document.getElementById('zh').textContent=z<2?'Zoom in for taxiways, gates & roads':z<4.6?'Zoom in more for markings & aircraft':'Full detail';
 const ftpx=FT/k;const cands=[100,200,500,1000,2000,5000];let best=cands[0];cands.forEach(c=>{if(c/ftpx<=150)best=c;});document.getElementById('scalet').textContent=fmt(best)+' ft';document.getElementById('scaleb').style.width=f(best/ftpx)+'px';}
function fit(){const r=wrap.getBoundingClientRect();k=fitK();tx=(r.width-W*k)/2;ty=(r.height-H*k)/2-Y0*k;apply();}
function clampK(v){const fk=fitK();return Math.max(fk*.7,Math.min(fk*30,v));}
function zoomAt(sx,sy,nk){nk=clampK(nk);tx=sx-(sx-tx)*nk/k;ty=sy-(sy-ty)*nk/k;k=nk;apply();}
let anim=null;
function flyTo(p,nk){nk=clampK(nk);const r=wrap.getBoundingClientRect();const k0=k,x0=tx,y0=ty;const x1=r.width/2-p[0]*nk,y1=r.height/2-p[1]*nk;const t0=performance.now();cancelAnimationFrame(anim);
 const step=now=>{let q=Math.min(1,(now-t0)/500);q=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;const kk=k0*Math.pow(nk/k0,q);const cx=(r.width/2-x0)/k0,cy=(r.height/2-y0)/k0;const ex=p[0],ey=p[1];const mx=cx+(ex-cx)*q,my=cy+(ey-cy)*q;k=kk;tx=r.width/2-mx*kk;ty=r.height/2-my*kk;apply();if(q<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();const dz=ev.ctrlKey?ev.deltaY*.01:ev.deltaY*.0018;zoomAt(ev.clientX-r.left,ev.clientY-r.top,k*Math.exp(-dz));},{passive:false});
const ptrs=new Map();let moved=0,pinch=null,downT=null;
svg.addEventListener('pointerdown',ev=>{svg.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);moved=0;downT=ev.target;if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch={d:len(sub(a,b)),k};}svg.classList.add('dragging');});
svg.addEventListener('pointermove',ev=>{if(!ptrs.has(ev.pointerId))return;const prev=ptrs.get(ev.pointerId);const cur=[ev.clientX,ev.clientY];ptrs.set(ev.pointerId,cur);const r=svg.getBoundingClientRect();
 if(ptrs.size==1){tx+=cur[0]-prev[0];ty+=cur[1]-prev[1];moved+=Math.abs(cur[0]-prev[0])+Math.abs(cur[1]-prev[1]);apply();}
 else if(ptrs.size==2&&pinch){const[a,b]=[...ptrs.values()];const m=lerp(a,b,.5);moved+=99;const pm=lerp(prev,ptrs.get([...ptrs.keys()].find(x=>x!=ev.pointerId)),.5);tx+=m[0]-pm[0];ty+=m[1]-pm[1];zoomAt(m[0]-r.left,m[1]-r.top,pinch.k*len(sub(a,b))/pinch.d);}});
function up(ev){if(!ptrs.has(ev.pointerId))return;ptrs.delete(ev.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size==0){svg.classList.remove('dragging');if(moved<6){const t=(downT&&downT.closest)?downT.closest('[data-kind]'):null;if(t)show(t.dataset.kind,t.dataset.id,false);else home();}}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('dblclick',ev=>{const r=svg.getBoundingClientRect();zoomAt(ev.clientX-r.left,ev.clientY-r.top,k*2);});
const zc=d=>{const r=wrap.getBoundingClientRect();zoomAt(r.width/2,r.height/2,k*d);};
document.getElementById('zin').onclick=()=>zc(1.6);document.getElementById('zout').onclick=()=>zc(1/1.6);document.getElementById('zfit').onclick=()=>{fit();};
window.addEventListener('resize',()=>apply());
[['lac','noac'],['lhs','nohs'],['lals','noals'],['llab','nolab']].forEach(([i,c])=>document.getElementById(i).addEventListener('change',e=>svg.classList.toggle(c,!e.target.checked)));
document.getElementById('ptoggle').onclick=()=>document.getElementById('panel').classList.toggle('closed');
document.getElementById('sform').addEventListener('submit',ev=>{ev.preventDefault();const q=document.getElementById('q').value.trim().toLowerCase().replace(/^(gate|runway|rwy|taxiway|twy)\s*/,'');if(!q)return;
 let hit=INDEX.find(x=>x.k==q)||INDEX.find(x=>x.name.toLowerCase()==q)||INDEX.find(x=>x.k.startsWith(q))||INDEX.find(x=>x.name.toLowerCase().includes(q));
 if(hit)show(hit.kind,hit.id,true);else info.innerHTML='<div class="chips"><button data-home="1">← Overview</button></div><p class="note">Nothing matches “'+q.replace(/[<>&]/g,'')+'”.</p>';});
fit();home();
})();
</script>
